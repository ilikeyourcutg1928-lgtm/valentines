<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Will you be my Valentine?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1:#ffd7e6;
    --bg2:#ffeef5;
    --accent:#ff3b7a;
    --shadow: 0 18px 60px rgba(0,0,0,.15);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px;
    overflow-x:hidden;
    overflow-y:auto;
  }

  /* background stickers */
  .stickers{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .sticker{
    position:absolute;
    font-size:34px;
    opacity:.42;
    transform: rotate(var(--r,0deg));
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    animation: floaty 6s ease-in-out infinite;
  }
  @keyframes floaty{ 0%,100%{ transform: translateY(0) rotate(var(--r,0deg)); } 50%{ transform: translateY(-10px) rotate(var(--r,0deg)); } }
  .s1{ left:5vw; top:10vh; --r:-12deg; }
  .s2{ right:6vw; top:18vh; --r:10deg; animation-delay:.6s; }
  .s3{ left:6vw; bottom:18vh; --r:14deg; animation-delay:1.1s; }
  .s4{ right:5vw; bottom:14vh; --r:-9deg; animation-delay:1.7s; }
  .s5{ left:10vw; top:55vh; --r:8deg; animation-delay:2.1s; }
  .s6{ right:10vw; top:60vh; --r:-14deg; animation-delay:2.6s; }

  /* main card ALWAYS on top */
  .card{
    width:min(980px, 96vw);
    background: rgba(255,255,255,0.94);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 26px 22px 22px;
    text-align:center;
    position:relative;
    z-index:10;
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
  }


  .art{
    width:220px;
    height:220px;
    object-fit:contain;
    display:block;
    margin: 6px auto 10px;
    border-radius: 18px;
    background: rgba(255, 59, 122, 0.06);
  }

  h1{
    margin: 8px 0 18px;
    font-size: clamp(24px, 3.3vw, 42px);
    line-height:1.1;
  }

  .buttons{
    display:flex;
    gap:14px;
    justify-content:center;
    align-items:flex-start;
    margin-top: 6px;
  }

  button{
    border:none;
    cursor:pointer;
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 16px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.12);
    transition: transform .12s ease;
  }
  button:hover{ transform: translateY(-1px); }
  #yesBtn{ background: var(--accent); color:white; }
  #noBtn{ background: #e9edf3; color:#111827; position:relative; }

  .hint{
    margin-top: 14px;
    font-size: 12px;
    color: rgba(0,0,0,0.55);
  }

  /* YES section */
  .result{ display:none; margin-top: 18px; }
  .yay-title{ margin: 0; font-size: 44px; }
  .yay-subtitle{ margin: 8px 0 0; color: rgba(0,0,0,0.65); }

  /* string lines behind photos */
  .memories{
    position:relative;
    margin-top: 18px;
    padding: 10px 6px 0;
  }
  .memories::before{
    content:"";
    position:absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,59,122,.22) 2px, transparent 3px) 0 0/120px 120px,
      radial-gradient(circle at 78% 30%, rgba(255,59,122,.18) 2px, transparent 3px) 0 0/140px 140px;
    opacity:.35;
    pointer-events:none;
  }
  svg.strings{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .polaroid-grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 12px;
    align-items:start;
  }

  .polaroid{
    background: transparent;
    border-radius: 18px;
    padding: 0;
    box-shadow: none;
    border: none;
    transform: rotate(var(--tilt, 0deg));
  }
  .polaroid img{
    width:100%;
    height: auto;
    object-fit: contain;
    border-radius: 18px;
    display:block;
    box-shadow: 0 16px 38px rgba(0,0,0,0.16);
  }
  /* place them like a collage */
  .p1{ grid-column: 1 / span 4;  --tilt:-7deg; }
  .p2{ grid-column: 5 / span 4;  --tilt: 5deg; margin-top: 18px; }
  .p3{ grid-column: 9 / span 4;  --tilt:-3deg; }
  .p4{ grid-column: 2 / span 4;  --tilt: 6deg; margin-top: 18px; }
  .p5{ grid-column: 6 / span 4;  --tilt:-5deg; margin-top: 40px; }
  .p6{ grid-column: 1 / span 6;  --tilt: 3deg; margin-top: 30px; }
  .p7{ grid-column: 7 / span 6;  --tilt:-4deg; margin-top: 30px; }

  .love-letter{
    margin-top: 18px;
    text-align:left;
    background: rgba(255,255,255,0.86);
    border: 1px solid rgba(255,59,122,0.16);
    border-radius: 18px;
    padding: 16px 16px;
  }
  .love-letter h3{ margin: 0 0 6px; font-size: 18px; }
  .love-letter p{ margin: 8px 0; line-height:1.6; color: rgba(0,0,0,0.78); }
  .ps{ font-weight:700; }

  .mini-actions{
    margin-top: 14px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    display:inline-block;
    padding:10px 14px;
    border-radius:999px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.75);
    font-weight:800;
    cursor:pointer;
  }

  /* mobile */
  @media (max-width: 820px){
    .polaroid-grid{ grid-template-columns: 1fr; }
    .p1,.p2,.p3,.p4,.p5,.p6,.p7{ grid-column: auto; margin-top: 0; }
    .polaroid img{ height: auto; }
  }
</style>
</head>

<body>
  <div class="stickers" aria-hidden="true">
    <span class="sticker s1">💌</span>
    <span class="sticker s2">✨</span>
    <span class="sticker s3">🌸</span>
    <span class="sticker s4">🎀</span>
    <span class="sticker s5">💗</span>
    <span class="sticker s6">💞</span>
  </div>

  <div class="card">
    <img class="art" src="d716c3bf5ea0d406aae3e045570ebf94.png" alt="cute valentine" onerror="this.style.display='none'">

    <h1><span id="herName">Annaya</span> will you be my valentine?</h1>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="hint" id="hint">“No” seems a bit shy 😈</div>

    <section class="result" id="result">
      <h2 class="yay-title">YAY!! 💘</h2>
      <p class="yay-subtitle">You just made my whole day 😭✨</p>

      <div class="memories">
        <!-- dotted string lines behind the polaroids -->
        <svg class="strings" viewBox="0 0 1000 600" preserveAspectRatio="none">
          <path d="M70,120 C240,40 380,60 520,140 C700,240 820,180 940,120" fill="none" stroke="rgba(255,59,122,.28)" stroke-width="3" stroke-dasharray="6 10" />
          <path d="M110,350 C260,260 420,280 560,360 C720,460 820,420 930,350" fill="none" stroke="rgba(255,59,122,.24)" stroke-width="3" stroke-dasharray="6 10" />
        </svg>

        <div class="polaroid-grid">
          <figure class="polaroid p1">
            <img src="1.png" alt="Memory 1">
</figure>

          <figure class="polaroid p2">
            <img src="2.png" alt="Memory 2">
</figure>

          <figure class="polaroid p3">
            <img src="3.png" alt="Memory 3">
</figure>

          <figure class="polaroid p4">
            <img src="4.png" alt="Memory 4">
</figure>

          <figure class="polaroid p5">
            <img src="5.png" alt="Memory 5">
</figure>

          <figure class="polaroid p6">
            <img src="6.png" alt="Memory 6">
</figure>

          <figure class="polaroid p7">
            <img src="7.png" alt="Memory 7">
</figure>
        </div>
      </div>

      <div class="love-letter">
        <h3>Dear Annaya,</h3>
        <p>
          I’ve been wanting to ask you this for a while. You make everything feel lighter and happier,
          and I’m really grateful I found you. 💗
        </p>
        <p class="ps">P.S. I owe you a proper cute date now 😌🍓</p>
      </div>

      <div class="mini-actions">
      </div>
    </section>
  </div>

<script src="confetti.browser.min.js"></script>
<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn  = document.getElementById('noBtn');
  const result = document.getElementById('result');
  const buttons = document.getElementById('buttons');

  function fireConfetti(){
    if (typeof confetti !== 'function') return;
    confetti({ particleCount: 160, spread: 70, origin: { y: 0.7 } });
    setTimeout(() => confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } }), 220);
  }

  yesBtn.addEventListener('click', () => {
    buttons.style.display = 'none';
    document.getElementById('hint').style.display = 'none';
    result.style.display = 'block';
    fireConfetti();
  });

  // shy "No" button that dodges the mouse
  noBtn.addEventListener('mouseenter', () => {
    const pad = 16;
    const maxX = Math.max(pad, window.innerWidth - noBtn.offsetWidth - pad);
    const maxY = Math.max(pad, window.innerHeight - noBtn.offsetHeight - pad);
    const x = Math.floor(Math.random() * maxX);
    const y = Math.floor(Math.random() * maxY);
    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  });

  document.getElementById('confettiAgain').addEventListener('click', fireConfetti);
</script>
</body>
</html>
